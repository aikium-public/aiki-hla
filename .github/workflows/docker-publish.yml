# Build + push two AIKI-HLA Docker images to GitHub Container Registry on
# every semver tag (v1.0.0 etc.) and on pushes to main.
#
#   ghcr.io/aikium-public/aiki-hla:<version>      (Dockerfile, inference-only CPU)
#   ghcr.io/aikium-public/aiki-hla:<version>-full (Dockerfile.full, end-to-end with ESM-2)
#
# The :latest tag follows the most recent semver tag. The workflow requires
# the repository to have the `packages: write` permission enabled (default
# for org-owned repos).
name: docker-publish

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile
            suffix: ""
            description: "inference-only CPU image"
          - dockerfile: Dockerfile.full
            suffix: "-full"
            description: "end-to-end image with ESM-2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},suffix=${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.suffix }}
            type=ref,event=branch,suffix=${{ matrix.suffix }}
            type=raw,value=latest${{ matrix.suffix }},enable={{ is_default_branch }}

      - name: Build and push (${{ matrix.description }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
